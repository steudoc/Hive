<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="keywords" content="web, blog, html, css">
        <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <title>Hive</title>
    </head>
    <body>
        <div class="container-fluid p-0">
            <header class="p-3 mb-4">
                <div class="row">
                    <div class="col-sm-8 col-md-9 col-lg-10">
                        <a href="{{ url_for('home') }}" class="d-flex text-decoration-none">
                            <img src="{{ url_for('static', filename='images/logo_no_sfondo.PNG') }}" alt="Logo" class="me-2">
                            <h1>Hive</h1>
                        </a>
                    </div>
                    <div class="second col-sm-4 col-md-3 col-lg-2">
                        <div class="nav nav-pills d-flex gap-1">
                            <a href="{{ url_for('home') }}" class="btn btn-outline-light">Home</a>
                            <a href="{{ url_for('about') }}" class="btn btn-outline-light">Chi siamo</a>
                        </div>
                    </div>
                </div>
            </header>
            
            <div class="row p-2">
                <div class="col-sm-12 col-md-12 col-lg-3 col-xl-3">
                    <div class="menu main d-flex flex-wrap rounded-3 shadow pt-2 px-2">
                        <button type="button" class="btn btn-outline-warning col-sm-3 col-lg-12" onclick="location.href='#'">Oggi</button>
                        <button type="button" class="btn btn-outline-warning col-sm-3 col-lg-12 active" onclick="location.href='#'">Questa settimana</button>
                        <button type="button" class="btn btn-outline-warning col-sm-3 col-lg-12" onclick="location.href='#'">Questo mese</button>
                    </div>
                </div>
                <div class="col-sm-12 col-md-12 col-lg-9">
                    {% for post in posts %}
                        <div class="main p-2 bg-body-tertiary rounded-3 shadow">
                            <article class="articleclass col-12 d-flex flex-wrap">
                                <img class="photo col-sm-12 col-md-6 col-lg-3" src="{{ post.immagine_post }}" alt="post_photo">
                                <section class="sectionclass col-sm-12 col-md-6 col-lg-9">
                                    <div>
                                        <div class="profile_info">
                                            <img class="profile_photo" src="{{ post.immagine_profilo }}" alt="profile_photo">
                                            <a class="profile" href="">@{{ post.username }}</a>
                                        </div>
                                        <p class="days">{{ post.data_pubblicazione }}</p>
                                    </div>
                                    <p class="paragraph">{{ post.testo }}</p>
                                    <p class="hashtags">
                                        {% for hashtag in post.hashtags %}
                                            <a href="#" class="btn btn-warning">#{{ hashtag }}</a>
                                        {% endfor %}
                                    </p>
                                </section>
                            </article>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>

        <!--<a class="btn btn-warning rounded-circle text-white" href="#" role="button"><h1>+</h1></a>-->
        <div id="plus"><a href="#"><a href="#"><i class="bi bi-plus-lg"></i></a></a></div>
        
    </body>
</html>
