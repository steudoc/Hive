<!DOCTYPE html>
<html lang="it">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="keywords" content="web, blog, html, css">
        <link href="{{ url_for('static', filename='css/styles.css') }}" rel="stylesheet">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=DynaPuff:wght@400..700&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
        <title>Hive - {% block title %}{% endblock %}</title>
    </head>
    <body>
        <div class="container-fluid p-0">
            <header class="p-3 mb-4">
                <div class="row">
                    <div class="col-sm-6 col-md-6 col-lg-6">
                        <a href="{{ url_for('home') }}" class="col-4 d-flex text-decoration-none">
                            <img src="{{ url_for('static', filename='images/logo_no_sfondo.PNG') }}" alt="Logo" class="me-2">
                            <h1>Hive</h1>
                        </a>
                    </div>
                    <div class="second col-sm-6 col-md-6 col-lg-6">
                        <div class="nav nav-pills d-flex gap-1">
                            {% block nav %} {% endblock %}
                            {% if current_user.is_authenticated %}
                                <a href="{{ url_for('user', username=current_user.username) }}" class="btn btn-warning">
                                    {{ current_user.username }}
                                </a>
                                <a href="{{ url_for('logout') }}" class="btn btn-outline-light">Logout</a>
                            {% else %}
                                <button id="login" type="button" class="btn btn-outline-light" data-bs-toggle="modal" data-bs-target="#loginModal" data-bs-whatever="@mdo">Login</button>
                            {% endif %}

                            <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
                                <div class="modal-dialog">
                                    <div class="modal-content" id="modal-content">
                                        <div class="modal-header">
                                            <h1 class="modal-title fs-5" id="loginModalLabel">Login</h1>
                                            <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                        </div>
                                        <div class="modal-body">
                                            <form id="login" action="/login" method="POST" enctype="multipart/form-data">
                                                <div class="mb-3">
                                                    <label for="email" class="col-form-label">Email</label>
                                                    <input type="email" class="form-control" id="email" name="email" placeholder="Inserisci la tua email" required>
                                                </div>
                                                <div class="mb-3">
                                                    <label for="password" class="col-form-label">Password</label>
                                                    <input type="password" class="form-control" id="password" name="password" placeholder="Inserisci la tua password" required>
                                                </div>
                                                <div class="col-12 p-3">
                                                    <small>Non hai ancora creato un account? <a href="{{ url_for('register') }}">Registrati</a></small>
                                                </div>
                                                <div class="modal-footer">
                                                    <button type="reset" class="btn btn-outline-light" data-bs-dismiss="modal">Chiudi</button>
                                                    <button type="submit" class="btn btn-warning">Accedi</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            {% block content %}
        
            {% endblock %}

        </div>

        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.5/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-k6d4wzSIapyDyv1kpU366/PK5hCdSbCRGRCMv+eplOQJWyd1fbcAu9OCUj5zNLiq"
            crossorigin="anonymous">
            
        </script>
    </body>
</html>
